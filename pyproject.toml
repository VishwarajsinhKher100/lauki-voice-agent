[project]
name = "lauki-voice-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vishwarajsinh Kher", email = "vishwarajsinh.kher100@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docling>=2.130.0",
    "docling-core>=2.99.0",
    "dotenv>=0.9.9",
    "langchain>=1.4.2",
    "langchain-core>=1.6.5",
    "langchain-groq>=1.1.3",
    "livekit>=1.1.20",
    "livekit-agents>=1.3.11",
    "livekit-plugins-deepgram>=1.3.11",
    "livekit-plugins-langchain>=1.3.11",
    "livekit-plugins-silero>=1.2.15",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.57",
]

[project.scripts]
lauki-voice-agent = "lauki_voice_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
